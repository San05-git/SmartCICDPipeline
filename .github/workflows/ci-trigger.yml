# =============================================================================
# ci-trigger.yml — GitHub Actions Workflow to Trigger Jenkins Pipeline
# =============================================================================
# This workflow runs whenever code is pushed to the main branch.
# It sends a webhook request to Jenkins, which executes the Jenkinsfile.
# =============================================================================

name: CI Trigger — Notify Jenkins

# -----------------------------------------------------------------------------
# TRIGGER
# -----------------------------------------------------------------------------
on:
  push:
    branches: [ main ]

# -----------------------------------------------------------------------------
# JOBS
# -----------------------------------------------------------------------------
jobs:
  notify-jenkins:

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------------------------
      # Step 1: Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 2: Trigger Jenkins using Generic Webhook Trigger
      # -----------------------------------------------------------------------
      - name: Trigger Jenkins Pipeline
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          echo "Notifying Jenkins..."
          curl -X POST \
            "${JENKINS_URL}/generic-webhook-trigger/invoke?token=${JENKINS_TOKEN}" \
            --fail \
            --silent \
            --show-error
          echo ""
          echo "Jenkins pipeline triggered successfully."

      # -----------------------------------------------------------------------
      # Step 3: Log trigger information
      # -----------------------------------------------------------------------
      - name: Log trigger event
        run: |
          echo "Pipeline triggered at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
